version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: chapchap
      POSTGRES_PASSWORD: chapchap_pass
      POSTGRES_DB: chapchapdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://chapchap:chapchap_pass@db:5432/chapchapdb
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres-data:
